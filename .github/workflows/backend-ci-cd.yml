name: Backend CI/CD - Golang to ECR and EC2

on:
push:
branches: [feature/full-stack]
paths:
- "Server/**"
pull_request:
branches: [feature/full-stack]
paths:
- "Server/**"

env:
AWS_REGION: ${{ secrets.AWS_REGION }}
ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
IMAGE_TAG: ${{ github.sha }}

jobs:
test:
name: Test
runs-on: ubuntu-latest

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Set up Go
    uses: actions/setup-go@v5
    with:
      go-version: "1.21"

  - name: Install dependencies
    run: |
      cd Server
      go mod tidy

  - name: Run vet (code quality)
    run: |
      cd Server
      go vet ./...

  - name: Run tests
    run: |
      cd Server
      go test ./... -v -timeout 60s
    continue-on-error: true

  - name: Run vulnerability scan
    run: |
      cd Server
      go install golang.org/x/vuln/cmd/govulncheck@latest
      govulncheck ./...
    continue-on-error: true
```

build:
name: Build and Push to ECR
runs-on: ubuntu-latest
needs: test
if: github.event_name == 'push' && github.ref == 'refs/heads/feature/full-stack'
outputs:
image: ${{ steps.build-image.outputs.image }}

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Login to Amazon ECR
    id: login-ecr
    uses: aws-actions/amazon-ecr-login@v2

  - name: Create ECR repository if it does not exist
    run: |
      aws ecr describe-repositories \
        --repository-names ${{ secrets.ECR_REPOSITORY }} \
        --region ${{ secrets.AWS_REGION }} || \
      aws ecr create-repository \
        --repository-name ${{ secrets.ECR_REPOSITORY }} \
        --region ${{ secrets.AWS_REGION }}

  - name: Build tag and push Docker image
    id: build-image
    run: |
      cd Server
      IMAGE_URI=$ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
      LATEST_URI=$ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:latest
      docker build -t $IMAGE_URI -t $LATEST_URI .
      docker push $IMAGE_URI
      docker push $LATEST_URI
      echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT
    env:
      ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

  - name: Scan image for vulnerabilities
    run: |
      aws ecr start-image-scan \
        --repository-name ${{ secrets.ECR_REPOSITORY }} \
        --image-id imageTag=${{ github.sha }} \
        --region ${{ secrets.AWS_REGION }}
    continue-on-error: true
```

deploy:
name: Deploy to EC2
runs-on: ubuntu-latest
needs: build
if: github.event_name == 'push' && github.ref == 'refs/heads/feature/full-stack'

```
steps:
  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Login to Amazon ECR
    id: login-ecr
    uses: aws-actions/amazon-ecr-login@v2

  - name: Deploy to EC2 via SSM
    run: |
      IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
      aws ssm send-command \
        --document-name "AWS-RunShellScript" \
        --targets "Key=tag:Name,Values=starttech-server" \
        --parameters commands="[
          'aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}',
          'docker pull $IMAGE_URI',
          'docker stop starttech-backend || true',
          'docker rm starttech-backend || true',
          'docker run -d --name starttech-backend --restart unless-stopped -p 8080:8080 $IMAGE_URI',
          'docker system prune -f'
        ]" \
        --region ${{ secrets.AWS_REGION }}

  - name: Health check
    run: |
      sleep 30
      STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.ALB_DNS_NAME }}/health || echo "000")
      echo "Health status: $STATUS"

  - name: Deployment summary
    run: |
      echo "Backend deployed successfully"
      echo "Image: ${{ needs.build.outputs.image }}"
```
