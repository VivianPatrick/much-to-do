name: Backend CI/CD - Zero Failure Design

on:
  push:
    branches: [feature/full-stack]
    paths:
      - "Server/**"
  pull_request:
    branches: [feature/full-stack]
    paths:
      - "Server/**"

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:

# ─────────────────────────────
# VALIDATION JOB (FAIL FAST)
# ─────────────────────────────
  validate:
    name: Validate Repo Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Go module exists
        run: |
          test -f Server/go.mod
          test -f Server/go.sum

      - name: Show structure (debug safe)
        run: ls -R Server


# ─────────────────────────────
# TEST JOB (NO STATE DEPENDENCY)
# ─────────────────────────────
  test:
    name: Test Go Service
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Download deps
        run: go mod download
        working-directory: Server

      - name: Vet
        run: go vet ./...
        working-directory: Server

      - name: Test
        run: go test ./... -v
        working-directory: Server


# ─────────────────────────────
# BUILD JOB (IMMUTABLE ARTIFACT)
# ─────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (explicit context)
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
          docker build -f Server/Dockerfile -t $IMAGE Server
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT


# ─────────────────────────────
# DEPLOY JOB (SAFE ROLLOUT)
# ─────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy via SSM (immutable image)
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=starttech-server" \
            --parameters commands="[
              'aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.ecr.outputs.registry }}',
              'docker pull $IMAGE',
              'docker stop backend || true',
              'docker rm backend || true',
              'docker run -d --name backend --restart unless-stopped -p 8080:8080 $IMAGE'
            ]" \
            --region ${{ secrets.AWS_REGION }}

      - name: Health check
        run: |
          sleep 20
          curl -f http://${{ secrets.ALB_DNS_NAME }}/health || exit 1
