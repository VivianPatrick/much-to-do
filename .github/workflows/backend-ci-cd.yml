name: Backend CI/CD - Golang to ECR and EC2

on:
  push:
    branches: [feature/full-stack]
    paths:
      - "Server/**"
  pull_request:
    branches: [feature/full-stack]
    paths:
      - "Server/**"

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Test
  # ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # BEFORE
      - name: Install dependencies
        working-directory: Server
        run: go mod download

      # AFTER
      - name: Install dependencies
        working-directory: Server
        run: go mod download all

      - name: Install dependencies
        working-directory: Server
        run: go mod download

      - name: Run vet (code quality)
        working-directory: Server
        run: go vet ./...

      - name: Run tests
        working-directory: Server
        run: |
          go test ./... -v -timeout 60s
        continue-on-error: true

      - name: Run vulnerability scan
        working-directory: Server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        continue-on-error: true

  # ─────────────────────────────────────────────
  # JOB 2: Build and push Docker image to ECR
  # ─────────────────────────────────────────────
  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/full-stack'
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if it does not exist
        run: |
          aws ecr describe-repositories \
            --repository-names ${{ secrets.ECR_REPOSITORY }} \
            --region ${{ secrets.AWS_REGION }} || \
          aws ecr create-repository \
            --repository-name ${{ secrets.ECR_REPOSITORY }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Build, tag and push Docker image
        id: build-image
        working-directory: Server
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
          LATEST_URI=$ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:latest

          docker build -t $IMAGE_URI -t $LATEST_URI .
          docker push $IMAGE_URI
          docker push $LATEST_URI

          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "Built and pushed: $IMAGE_URI"

      - name: Scan image for vulnerabilities
        run: |
          aws ecr start-image-scan \
            --repository-name ${{ secrets.ECR_REPOSITORY }} \
            --image-id imageTag=${{ github.sha }} \
            --region ${{ secrets.AWS_REGION }}
          echo "Image scan started - check ECR console for results"
        continue-on-error: true

  # ─────────────────────────────────────────────
  # JOB 3: Deploy to EC2 via rolling update
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/full-stack'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy to EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

          # Send deploy command to EC2 instance via SSM (no SSH needed)
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=starttech-server" \
            --parameters commands="[
              'aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY',
              'docker pull $IMAGE_URI',
              'docker stop starttech-backend || true',
              'docker rm starttech-backend || true',
              'docker run -d --name starttech-backend --restart unless-stopped -p 8080:8080 --log-driver=awslogs --log-opt awslogs-group=/starttech/dev/backend --log-opt awslogs-stream=\$(curl -s http://169.254.169.254/latest/meta-data/instance-id) $IMAGE_URI',
              'docker system prune -f'
            ]" \
            --region ${{ secrets.AWS_REGION }} \
            --output text
          echo "Deploy command sent to EC2 via SSM"

      - name: Trigger ASG instance refresh (rolling update)
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name starttech-asg \
            --preferences MinHealthyPercentage=50 \
            --region ${{ secrets.AWS_REGION }}
          echo "ASG rolling update triggered"
        continue-on-error: true

      - name: Health check
        run: |
          echo "Waiting 30s for deployment to stabilise..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.ALB_DNS_NAME }}/health || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Health check passed"
          else
            echo "Health check returned $STATUS - deployment may still be starting"
          fi
        continue-on-error: true

      - name: Deployment summary
        run: |
          echo "Backend deployed successfully"
          echo "Image: ${{ needs.build.outputs.image }}"
          echo "ALB: http://${{ secrets.ALB_DNS_NAME }}"
          echo "Commit: ${{ github.sha }}"
