name: Backend CI/CD - Production Stable

on:
  push:
    branches: [feature/full-stack]
    paths:
      - "Server/**"
  pull_request:
    branches: [feature/full-stack]
    paths:
      - "Server/**"

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:

# ─────────────────────────────
# VALIDATION (FAIL FAST)
# ─────────────────────────────
  validate:
    name: Validate Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Confirm Go module exists
        run: |
          test -f Server/go.mod
          test -f Server/go.sum

      - name: Show Server directory
        run: ls -R Server


# ─────────────────────────────
# TEST JOB (GO SAFE EXECUTION)
# ─────────────────────────────
  test:
    name: Test Go Backend
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Download dependencies
        run: go mod download
        working-directory: Server

      - name: Run vet
        run: go vet ./...
        working-directory: Server

      - name: Run tests
        run: go test ./... -v -timeout 60s
        working-directory: Server

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        working-directory: Server
        continue-on-error: true


# ─────────────────────────────
# BUILD JOB (DOCKER IMAGE)
# ─────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
          docker build -f Server/Dockerfile -t $IMAGE Server
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT


# ─────────────────────────────
# DEPLOY JOB (EC2 VIA SSM)
# ─────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy via SSM
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=starttech-server" \
            --parameters commands="[
              'aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.ecr.outputs.registry }}',
              'docker pull $IMAGE',
              'docker stop backend || true',
              'docker rm backend || true',
              'docker run -d --name backend --restart unless-stopped -p 8080:8080 $IMAGE'
            ]" \
            --region ${{ secrets.AWS_REGION }}

      - name: Health Check
        run: |
          sleep 20
          curl -f http://${{ secrets.ALB_DNS_NAME }}/health || exit 1
