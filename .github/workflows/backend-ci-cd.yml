name: Backend CI/CD (Production Grade)

on:
  push:
    branches: [feature/full-stack]
    paths:
      - "Server/**"
  pull_request:
    branches: [feature/full-stack]
    paths:
      - "Server/**"

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  APP_DIR: Server

jobs:

# ─────────────────────────────
# 1. VALIDATION (STRUCTURE CHECK)
# ─────────────────────────────
  validate:
    name: Validate Project Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Go module (hard fail safe)
        run: |
          cd $APP_DIR
          test -f go.mod
          test -f go.sum

      - name: Print directory tree
        run: |
          cd $APP_DIR
          ls -la


# ─────────────────────────────
# 2. TEST JOB (GO SAFE EXECUTION)
# ─────────────────────────────
  test:
    name: Test Go Service
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Download dependencies
        run: cd $APP_DIR && go mod download

      - name: Run static analysis
        run: cd $APP_DIR && go vet ./...

      - name: Run unit tests
        run: cd $APP_DIR && go test ./... -v -timeout 60s

      - name: Vulnerability scan
        run: |
          cd $APP_DIR
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        continue-on-error: true


# ─────────────────────────────
# 3. BUILD JOB (DOCKER IMAGE)
# ─────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image (stable context)
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

          docker build \
            -f $APP_DIR/Dockerfile \
            -t $IMAGE \
            $APP_DIR

          docker push $IMAGE

          echo "image=$IMAGE" >> $GITHUB_OUTPUT


# ─────────────────────────────
# 4. DEPLOY JOB (EC2 SSM SAFE DEPLOY)
# ─────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy via SSM (immutable release)
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=starttech-server" \
            --parameters commands="[
              'aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.ecr.outputs.registry }}',
              'docker pull $IMAGE',
              'docker stop backend || true',
              'docker rm backend || true',
              'docker run -d --name backend --restart unless-stopped -p 8080:8080 $IMAGE'
            ]" \
            --region ${{ secrets.AWS_REGION }}

      - name: Health check
        run: |
          sleep 20
          curl -f http://${{ secrets.ALB_DNS_NAME }}/health || exit 1
