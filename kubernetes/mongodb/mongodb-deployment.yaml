apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: muchtodo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:8.0
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: MONGO_INITDB_ROOT_USERNAME
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: MONGO_INITDB_ROOT_PASSWORD
        - name: MONGO_INITDB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: mongodb-configmap
              key: MONGO_INITDB_DATABASE
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        - name: mongodb-keyfile
          mountPath: /data/keyfile
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      initContainers:
      - name: fix-keyfile
        image: mongo:8.0
        command:
        - bash
        - -c
        - |
          cp /tmp/keyfile/mongodb.key /data/keyfile/mongodb.key
          chmod 400 /data/keyfile/mongodb.key
          chown 999:999 /data/keyfile/mongodb.key
        volumeMounts:
        - name: mongodb-keyfile-raw
          mountPath: /tmp/keyfile
        - name: mongodb-keyfile
          mountPath: /data/keyfile
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-pvc
      - name: mongodb-keyfile-raw
        configMap:
          name: mongodb-keyfile-config
      - name: mongodb-keyfile
        emptyDir: {}
